services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - .:/project
    working_dir: /project
    environment:
      - BUILD_TYPE=Release
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: devcontainer
    working_dir: /workspace
    volumes:
      - .:/workspace
      - dev-out:/workspace/out
    stdin_open: true
    tty: true
    command: /bin/zsh

volumes:
  dev-out:
