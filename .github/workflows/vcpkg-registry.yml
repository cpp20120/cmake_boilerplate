name: vcpkg registry

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the source tag and GitHub Release after all package checks pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, triplet: x64-linux, linkage: STATIC }
          - { os: ubuntu-24.04, triplet: x64-linux-boilerplate-shared, linkage: SHARED }
          - { os: windows-latest, triplet: x64-windows-static, linkage: STATIC }
          - { os: windows-latest, triplet: x64-windows, linkage: SHARED }
          - { os: macos-14, triplet: arm64-osx, linkage: STATIC }
          - { os: macos-14, triplet: arm64-osx-boilerplate-shared, linkage: SHARED }
    defaults:
      run:
        shell: bash
    env:
      VCPKG_BINARY_SOURCES: clear
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Verify version database and source pins
        run: python scripts/registry.py verify
      - name: Read pinned vcpkg revision
        id: pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('vcpkg=' + json.load(open('vcpkg/release.json'))['vcpkg-baseline'])
          PY
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.pins.outputs.vcpkg }}
          path: external/vcpkg
          fetch-depth: 0
      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./external/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Bootstrap pinned vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Prepare consumer outside the source checkout
        run: |
          python scripts/registry.py prepare \
            --output "$RUNNER_TEMP/registry-consumer" \
            --repository "$(python -c 'from pathlib import Path; print(Path.cwd().as_uri())')" \
            --baseline "$(git rev-parse HEAD)"
      - name: Install from Git registry (no overlay ports or binary cache)
        run: |
          external/vcpkg/vcpkg install \
            --x-manifest-root="$RUNNER_TEMP/registry-consumer" \
            --x-install-root="$RUNNER_TEMP/registry-installed" \
            --triplet=${{ matrix.triplet }} \
            --overlay-triplets="$GITHUB_WORKSPACE/vcpkg/triplets"
      - name: Configure, link and run Debug and Release consumers
        run: |
          cmake -S "$RUNNER_TEMP/registry-consumer" -B "$RUNNER_TEMP/registry-build" \
            -G "Ninja Multi-Config" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/external/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/registry-installed" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DEXPECT_LINKAGE=${{ matrix.linkage }}
          for config in Debug Release; do
            cmake --build "$RUNNER_TEMP/registry-build" --config "$config" --parallel 2
            ctest --test-dir "$RUNNER_TEMP/registry-build" -C "$config" --output-on-failure --no-tests=error
          done

  release:
    needs: consumer
    if: github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare downloadable consumer pinned to the tested registry commit
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/registry.py verify
          python scripts/registry.py prepare --output "$RUNNER_TEMP/consumer" \
            --repository "https://github.com/$REPOSITORY.git" --baseline "$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess
          release = json.load(open('vcpkg/release.json'))
          tag, source = release['tag'], release['commit']
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
          if existing.returncode == 0 and existing.stdout.strip() != source:
              raise SystemExit(f'{tag} already points to a different source commit')
          if release['repository'] != os.environ['REPOSITORY']:
              raise SystemExit('Update source pins before publishing from a fork')
          baseline = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          shutil.make_archive(str(temp / 'registry-consumer'), 'zip', temp / 'consumer')
          (temp / 'release-notes.md').write_text(
              f"library1 and library2 {release['version']}\n\n"
              f"Source tag: `{tag}`\n\nSource commit: `{source}`\n\n"
              f"Source archive SHA512: `{release['sha512']}`\n\n"
              f"vcpkg Git registry baseline: `{baseline}`\n\n"
              "The attached consumer uses this exact registry baseline. Install its manifest with vcpkg, "
              "then configure CMake with the vcpkg toolchain. See the repository's vcpkg/README.md.\n"
          )
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG={tag}\nSOURCE_COMMIT={source}\n')
          PY
      - name: Publish source tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/registry-consumer.zip" \
            --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
