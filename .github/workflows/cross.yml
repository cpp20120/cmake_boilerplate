name: Cross compilation
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  linux-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install target compiler and optional emulator
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu qemu-user ninja-build
      - name: Check cross semantics without an SDK
        run: cmake "-DCHECK_BINARY=${{ runner.temp }}/cross-semantics" -P lib/tests/cmake/verify_cross.cmake
      - name: Build and package real AArch64 artifacts; test through QEMU
        run: >-
          cmake "-DCHECK_BINARY=${{ runner.temp }}/cross-aarch64"
          "-DCHECK_TOOLCHAIN=${{ github.workspace }}/toolchains/linux-aarch64.cmake"
          -DCHECK_ARCH=aarch64
          "-DCHECK_EMULATOR=qemu-aarch64;-L;/usr/aarch64-linux-gnu"
          -P lib/tests/cmake/verify_cross.cmake
      - name: Check the public preset
        run: |
          cmake --preset linux-arm64 -DBOILERPLATE_COMPILER_CACHE=none
          cmake --build --preset linux-arm64 --parallel 2
