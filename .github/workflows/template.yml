
name: Project template

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  init:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check template manifest against tracked files
        run: cmake -P scripts/TemplateManifest.cmake

      - name: Test manifest policy
        run: cmake "-DCHECK_BINARY=${{ runner.temp }}/template-policy-check" -P scripts/test-template-manifest.cmake

      - name: Check one-command bootstrap (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/test-entry.sh

      - name: Check one-command bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-entry.ps1

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Check local CTest dashboard without submission
        run: cmake "-DCHECK_BINARY=${{ runner.temp }}/dashboard-check" -P scripts/test-dashboard.cmake

      # A CTest script-mode failure can otherwise collapse the build output
      # to "Error(s) when building project" and hide the actual compiler error.
      - name: Preserve CTest dashboard diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dashboard-check/**/Testing/Temporary/**
            ${{ runner.temp }}/dashboard-check/**/Testing/*/Build.xml
            ${{ runner.temp }}/dashboard-check/**/Testing/*/Configure.xml
          if-no-files-found: ignore

      - name: Generate, build and test a renamed project
        run: cmake "-DCHECK_BINARY=${{ runner.temp }}/template-check" -P scripts/test-init.cmake
